services:
  product-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: product-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P@ssw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'P@ssw0rd' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  order-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P@ssw0rd"
    ports:
      - "1434:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'P@ssw0rd' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  product-service:
    build:
      context: ./src/ProductService
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__ProductDatabase: "Server=product-db;Database=ProductDb;User Id=sa;Password=P@ssw0rd;TrustServerCertificate=True"
    depends_on:
       product-db:
          condition: service_healthy

  order-service:
    build:
      context: ./src/OrderService
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8081:8080"

    environment:
      ConnectionStrings__OrderDatabase: "Server=order-db,1433;Database=OrderDb;User Id=sa;Password=P@ssw0rd;TrustServerCertificate=True"

      PRODUCT_SERVICE_URL: http://product-service:8080

    depends_on:
      - product-service
      - order-db